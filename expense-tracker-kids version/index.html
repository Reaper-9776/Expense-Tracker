<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Main Screen -->
    <div id="mainScreen" class="screen active">
      <div class="container">
        <div class="header">
          <h1>Expense Tracker</h1>
        </div>

        <div class="balance-card">
          <p class="balance-label">Total Balance</p>
          <h2 class="balance-amount" id="totalBalance">$0</h2>
        </div>

        <div class="categories">
          <button class="category-btn" data-category="food">
            <span class="icon">🍔</span>
            <span>Food</span>
          </button>
          <button class="category-btn" data-category="transport">
            <span class="icon">🚗</span>
            <span>Transport</span>
          </button>
          <button class="category-btn" data-category="shopping">
            <span class="icon">🛍️</span>
            <span>Shopping</span>
          </button>
          <button class="category-btn" data-category="entertainment">
            <span class="icon">🎬</span>
            <span>Entertainment</span>
          </button>
          <button class="category-btn" data-category="bills">
            <span class="icon">💡</span>
            <span>Bills</span>
          </button>
          <button class="category-btn" data-category="other">
            <span class="icon">📦</span>
            <span>Other</span>
          </button>
        </div>

        <div class="action-buttons">
          <button class="btn btn-primary" id="addExpenseBtn">
            Add Expense
          </button>
          <button class="btn btn-success" id="addIncomeBtn">Add Income</button>
        </div>

        <div class="action-buttons" style="margin-top: 15px">
          <button class="btn btn-secondary" id="viewHistoryBtn">
            View History
          </button>
        </div>
      </div>
    </div>

    <!-- Add Expense Modal -->
    <div id="addExpenseModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Add Expense</h2>
          <button class="close-btn" id="closeModal">&times;</button>
        </div>
        <form id="expenseForm">
          <div class="form-group">
            <label for="amount">Amount ($)</label>
            <input
              type="number"
              id="amount"
              step="0.01"
              required
              placeholder="0.00"
            />
          </div>
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" required>
              <option value="">Select Category</option>
              <option value="food">Food</option>
              <option value="transport">Transport</option>
              <option value="shopping">Shopping</option>
              <option value="entertainment">Entertainment</option>
              <option value="bills">Bills</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="note">Note (Optional)</label>
            <textarea id="note" rows="3" placeholder="Add a note..."></textarea>
          </div>
          <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" required />
          </div>
          <button type="submit" class="btn btn-primary btn-block">
            Save Expense
          </button>
        </form>
      </div>
    </div>

    <!-- Add Income Modal -->
    <div id="addIncomeModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Add Income</h2>
          <button class="close-btn" id="closeIncomeModal">&times;</button>
        </div>
        <form id="incomeForm">
          <div class="form-group">
            <label for="incomeAmount">Amount ($)</label>
            <input
              type="number"
              id="incomeAmount"
              step="0.01"
              required
              placeholder="0.00"
            />
          </div>
          <div class="form-group">
            <label for="incomeSource">Source</label>
            <select id="incomeSource" required>
              <option value="">Select Source</option>
              <option value="salary">Salary</option>
              <option value="freelance">Freelance</option>
              <option value="investment">Investment</option>
              <option value="gift">Gift</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="incomeNote">Note (Optional)</label>
            <textarea
              id="incomeNote"
              rows="3"
              placeholder="Add a note..."
            ></textarea>
          </div>
          <div class="form-group">
            <label for="incomeDate">Date</label>
            <input type="date" id="incomeDate" required />
          </div>
          <button type="submit" class="btn btn-success btn-block">
            Save Income
          </button>
        </form>
      </div>
    </div>

    <!-- History Screen -->
    <div id="historyScreen" class="screen">
      <div class="container">
        <div class="header">
          <button class="back-btn" id="backBtn">← Back</button>
          <h1>Transaction History</h1>
        </div>

        <div class="filter-section">
          <select id="filterType">
            <option value="all">All Transactions</option>
            <option value="expense">Expenses Only</option>
            <option value="income">Income Only</option>
          </select>
          <select id="filterCategory" style="margin-top: 10px">
            <option value="all">All Categories</option>
            <option value="food">Food</option>
            <option value="transport">Transport</option>
            <option value="shopping">Shopping</option>
            <option value="entertainment">Entertainment</option>
            <option value="bills">Bills</option>
            <option value="salary">Salary</option>
            <option value="freelance">Freelance</option>
            <option value="investment">Investment</option>
            <option value="gift">Gift</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div id="expenseList" class="expense-list">
          <!-- Transactions will be dynamically added here -->
        </div>

        <div id="emptyState" class="empty-state">
          <p>No transactions yet. Start tracking!</p>
        </div>
      </div>
    </div>

    <!-- Success Message -->
    <div id="successMessage" class="success-message">
      <div class="success-content">
        <span class="success-icon">✓</span>
        <p>Expense saved successfully!</p>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
